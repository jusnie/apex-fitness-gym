# Conservative single-worker profile for memory-constrained Android builds.
# Release packaging uses the same profile; no swap is required.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=96m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx256m
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
